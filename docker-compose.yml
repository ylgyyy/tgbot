services:
  tg-bot:
    image: ylgy007/tgbot:latest
    container_name: tgbot
    restart: unless-stopped

    # ---- 时区 & 密钥 (从同目录 .env 文件读取) ----
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data

    volumes:
      # 持久化黑名单 / 骗子库
      - ./data:/app/data

    # ---- 日志轮转 ----
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
